name: Daily fire risk

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risk-daily
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.RISK_DAILY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      NEXT_PUBLIC_RISK_DATA_URL: ${{ vars.NEXT_PUBLIC_RISK_DATA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # These packages are already used by the existing risk pipeline.
      - name: Install pipeline requirements
        run: python -m pip install duckdb==2.0.0 numpy==2.5.4 pandas==3.1.1 pyarrow==26.0.1 xarray==2026.9.0 scipy==1.18.1 lightgbm==4.7.0
      - name: Restore saved inputs and published files
        shell: bash
        run: |
          test -n "$BLOB_READ_WRITE_TOKEN"
          case "$NEXT_PUBLIC_RISK_DATA_URL" in
            https://*.public.blob.vercel-storage.com/risk) ;;
            *) echo 'Set NEXT_PUBLIC_RISK_DATA_URL to the public Blob risk folder' >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 3 "$NEXT_PUBLIC_RISK_DATA_URL/_state/bundle.tar.gz" -o "$RUNNER_TEMP/risk-state.tar.gz"
          tar -xzf "$RUNNER_TEMP/risk-state.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Refresh, score, and save the changes
        shell: bash
        run: |
          python pipeline/risk/daily.py --manifest "$RUNNER_TEMP/risk-before.json"
          python pipeline/risk/daily.py
          python pipeline/risk/score_daily.py
          python pipeline/risk/daily.py --publish "$RUNNER_TEMP/risk-before.json"
